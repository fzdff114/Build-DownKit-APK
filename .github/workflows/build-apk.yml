name: Build DownKit APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DownKit-Android-source.zip"
      - ".github/scripts/public-release-parts/**"
      - ".github/scripts/patch_reliability.py.gz.b64"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eu
          set +o pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Extract original project
        run: |
          test -s DownKit-Android-source.zip
          unzip -oq DownKit-Android-source.zip -d .
          test -f DownKit-Android/gradlew
          test -f DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt

      - name: Prepare ARM64 Kotlin and Gradle configuration
        working-directory: DownKit-Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('abiFilters += listOf("arm64-v8a", "x86_64")', 'abiFilters += listOf("arm64-v8a")', 1)
          if 'abiFilters += listOf("arm64-v8a")' not in s:
              raise SystemExit("ARM64 ABI filter is missing")
          lines = s.splitlines()
          if "    splits {" in lines:
              start = lines.index("    splits {")
              end = next((i for i in range(start + 1, len(lines)) if lines[i] == "    }"), None)
              if end is None:
                  raise SystemExit("Malformed ABI split block")
              del lines[start:end + 1]
          s = "\n".join(lines) + "\n"
          old = "\n".join(["    kotlinOptions {", '        jvmTarget = "17"', "    }"])
          s = s.replace(old, "", 1)
          if "compilerOptions {" not in s:
              s += "\n".join(["", "kotlin {", "    compilerOptions {", "        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)", "    }", "}", ""])
          if "splits {" in s:
              raise SystemExit("ABI split block was not removed")
          p.write_text(s)
          w = Path("gradle/wrapper/gradle-wrapper.properties")
          w.write_text(w.read_text().replace("gradle-8.13-bin.zip", "gradle-8.14.4-bin.zip"))
          PY

      - name: Assemble public DownKit 1.1.1 source changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downkit-patch"
          cat .github/scripts/public-release-parts/part*.b64 | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/downkit-patch/prepare.gz"
          ACTUAL="$(wc -c < "$RUNNER_TEMP/downkit-patch/prepare.gz" | tr -d ' ')"
          test "$ACTUAL" = "18369"
          gzip -t "$RUNNER_TEMP/downkit-patch/prepare.gz"
          gzip -dc "$RUNNER_TEMP/downkit-patch/prepare.gz" > "$RUNNER_TEMP/downkit-patch/prepare_public_release.py"
          python3 -m py_compile "$RUNNER_TEMP/downkit-patch/prepare_public_release.py"
          python3 "$RUNNER_TEMP/downkit-patch/prepare_public_release.py" DownKit-Android
          python3 -m py_compile DownKit-Android/app/src/main/python/bridge.py
          grep -q 'versionName = "1.1.0"' DownKit-Android/app/build.gradle.kts
          grep -q 'REQUEST_INSTALL_PACKAGES' DownKit-Android/app/src/main/AndroidManifest.xml

      - name: Fix task scrolling, responsive format list and site format fallback
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/scripts/patch_reliability.py.gz.b64 | gzip -dc > "$RUNNER_TEMP/patch_reliability.py"
          python3 -m py_compile "$RUNNER_TEMP/patch_reliability.py"
          python3 "$RUNNER_TEMP/patch_reliability.py" DownKit-Android
          python3 -m py_compile DownKit-Android/app/src/main/python/bridge.py
          grep -q 'versionName = "1.1.1"' DownKit-Android/app/build.gradle.kts
          grep -q 'private fun refreshTaskCards()' DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt
          ! grep -q 'formatScroll = ScrollView(this)' DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt

      - name: Compile-check the Android application
        working-directory: DownKit-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.DOWNKIT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOWNKIT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOWNKIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOWNKIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing repository secret DOWNKIT_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing repository secret DOWNKIT_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret DOWNKIT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret DOWNKIT_KEY_PASSWORD"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/downkit-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "DOWNKIT_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "DOWNKIT_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DOWNKIT_KEY_ALIAS=$KEY_ALIAS"
            echo "DOWNKIT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed ARM64 release APK
        working-directory: DownKit-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Package APK and public source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp DownKit-Android/app/build/outputs/apk/release/app-release.apk release-package/DownKit-1.1.1-arm64.apk
          (cd DownKit-Android && zip -qr "$GITHUB_WORKSPACE/release-package/DownKit-Android-1.1.1-source.zip" . -x '*/build/*' '.gradle/*' 'local.properties')
          (cd release-package && sha256sum DownKit-1.1.1-arm64.apk DownKit-Android-1.1.1-source.zip > SHA256SUMS.txt)
          ls -lh release-package/

      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: DownKit-release-package
          path: release-package/*
          if-no-files-found: error
          retention-days: 30
