name: Build DownKit APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DownKit-Android-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify build Python
        run: python3.13 --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eu
          set +o pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in Android SDK installation"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Extract DownKit project
        run: |
          test -f DownKit-Android-source.zip
          unzip -oq DownKit-Android-source.zip -d .
          test -f DownKit-Android/gradlew
          test -f DownKit-Android/settings.gradle.kts

      - name: Patch Kotlin and ABI compatibility
        working-directory: DownKit-Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          nl = chr(10)
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('abiFilters += listOf("arm64-v8a", "x86_64")', 'abiFilters += listOf("arm64-v8a")', 1)
          if 'abiFilters += listOf("arm64-v8a")' not in s:
              raise SystemExit("ARM64 ABI filter not found")
          old = nl.join(["    kotlinOptions {", '        jvmTarget = "17"', "    }"])
          if old in s:
              s = s.replace(old, "", 1)
          if "compilerOptions {" not in s:
              s += nl.join([
                  "",
                  "kotlin {",
                  "    compilerOptions {",
                  "        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)",
                  "    }",
                  "}",
                  ""
              ])
          lines = s.splitlines()
          if "    splits {" in lines:
              start = lines.index("    splits {")
              end = next((i for i in range(start + 1, len(lines)) if lines[i] == "    }"), None)
              if end is None:
                  raise SystemExit("Malformed ABI splits block")
              del lines[start:end + 1]
          s = nl.join(lines) + nl
          if "splits {" in s:
              raise SystemExit("ABI split block was not removed")
          p.write_text(s)
          w = Path("gradle/wrapper/gradle-wrapper.properties")
          t = w.read_text().replace("gradle-8.13-bin.zip", "gradle-8.14.4-bin.zip")
          w.write_text(t)
          PY
          grep -n -A4 'compilerOptions' app/build.gradle.kts
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Fix Chaquopy FFmpeg Java array bridge
        working-directory: DownKit-Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path("app/src/main/python/bridge.py")
          source = bridge.read_text()
          old_import = "from java import jarray, jclass, jstring"
          new_import = "from java import jclass"
          old_call = "                java_args = jarray(jstring)(arguments)" + chr(10) + '                jclass("com.downkit.android.FfmpegBridge").execute(java_args)'
          new_call = '                jclass("com.downkit.android.FfmpegBridge").execute(arguments)'
          if old_import not in source or old_call not in source:
              raise SystemExit("Expected broken Chaquopy jstring bridge was not found; refusing an unsafe partial patch")
          source = source.replace(old_import, new_import, 1)
          source = source.replace(old_call, new_call, 1)
          if "jstring" in source or "jarray(" in source:
              raise SystemExit("Obsolete Java string-array helper remains in bridge.py")
          bridge.write_text(source)

          gradle = Path("app/build.gradle.kts")
          config = gradle.read_text()
          if 'versionCode = 1' not in config or 'versionName = "1.0.0"' not in config:
              raise SystemExit("Unexpected app version; refusing to overwrite")
          config = config.replace("versionCode = 1", "versionCode = 2", 1)
          config = config.replace('versionName = "1.0.0"', 'versionName = "1.0.1"', 1)
          gradle.write_text(config)
          PY
          python3 -m py_compile app/src/main/python/bridge.py
          grep -n -A5 'run_ffmpeg_multiple_files' app/src/main/python/bridge.py
          grep -n -E 'versionCode|versionName' app/build.gradle.kts

      - name: Fix parsed URL snapshot and durable multi-task queue
        working-directory: DownKit-Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, name):
              if old not in text:
                  raise SystemExit("Missing patch anchor: " + name)
              return text.replace(old, new, 1)

          p = Path("app/src/main/java/com/downkit/android/MainActivity.kt")
          s = p.read_text()
          s = replace_once(s,
              "    private var parsedInfo: JSONObject? = null",
              "    private var parsedInfo: JSONObject? = null\n    private var parsedUrl: String? = null\n    private var parseGeneration: Long = 0L",
              "parsed URL fields")
          s = replace_once(s,
              "    private fun renderHome() {\n        currentTab = 1",
              "    private fun renderHome() {\n        currentTab = 1\n        parseGeneration += 1\n        parsedInfo = null\n        parsedUrl = null\n        formats = emptyList()",
              "home view reset")

          old = """        urlField = TextInputEditText(this).apply {
              setSingleLine(true)
              textSize = 15f
              inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_URI
              hint = "https://..."
          }
          linkLayout.addView(urlField)
          """
          new = """        urlField = TextInputEditText(this).apply {
              setSingleLine(true)
              textSize = 15f
              inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_URI
              hint = "https://..."
          }
          urlField?.addTextChangedListener(object : android.text.TextWatcher {
              override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) = Unit
              override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) = Unit
              override fun afterTextChanged(s: android.text.Editable?) {
                  parseGeneration += 1
                  parsedInfo = null
                  parsedUrl = null
                  formats = emptyList()
                  downloadButton?.isEnabled = false
                  parseButton?.isEnabled = true
                  parseButton?.text = "解析链接"
                  infoCard?.visibility = View.GONE
              }
          })
          linkLayout.addView(urlField)
          """
          s = replace_once(s, old, new, "URL editing invalidates parsed state")

          old = """    private fun parseLink() {
              val url = urlField?.text?.toString()?.trim().orEmpty()
              if (!(url.startsWith("https://") || url.startsWith("http://"))) {
                  toast("请先粘贴完整的视频链接")
                  return
              }
              parsedInfo = null
          """
          new = """    private fun parseLink() {
              val url = urlField?.text?.toString()?.trim().orEmpty()
              val parsedUri = runCatching { Uri.parse(url) }.getOrNull()
              if (!(url.startsWith("https://") || url.startsWith("http://")) || parsedUri?.host.isNullOrBlank()) {
                  toast("请先粘贴完整的视频链接")
                  return
              }
              val requestGeneration = ++parseGeneration
              parsedInfo = null
              parsedUrl = null
          """
          s = replace_once(s, old, new, "parse captures URL")

          old = """            runOnUiThread {
                parseButton?.isEnabled = true
                parseButton?.text = "解析链接"
                val result = runCatching { JSONObject(raw) }.getOrElse { JSONObject().put("ok", false).put("error", "解析结果格式错误") }
          """
          new = """            runOnUiThread {
                if (requestGeneration != parseGeneration || urlField?.text?.toString()?.trim() != url) return@runOnUiThread
                parseButton?.isEnabled = true
                parseButton?.text = "解析链接"
                val result = runCatching { JSONObject(raw) }.getOrElse { JSONObject().put("ok", false).put("error", "解析结果格式错误") }
          """
          s = replace_once(s, old, new, "ignore stale parse response")
          s = replace_once(s,
              "                parsedInfo = result\n                val views = infoCard?.tag as? HomeViews",
              "                parsedInfo = result\n                parsedUrl = url\n                val views = infoCard?.tag as? HomeViews",
              "persist inspected URL snapshot")

          old = """    private fun startDownload() {
              val info = parsedInfo ?: return toast("请先解析链接")
              val choice = formats.getOrNull(formatSpinner?.selectedItemPosition ?: 0) ?: formats.firstOrNull() ?: return
              val task = DownloadTaskStore.add(
                  this,
                  urlField?.text?.toString()?.trim().orEmpty(),
                  info.optString("title", "媒体下载"),
                  choice.selector,
                  choice.label
              )
          """
          new = """    private fun startDownload() {
              val info = parsedInfo ?: return toast("请先解析当前链接")
              val url = parsedUrl?.takeIf { it.isNotBlank() }
                  ?: return toast("链接已变化或未保存，请重新解析")
              if (urlField?.text?.toString()?.trim() != url) {
                  parsedInfo = null
                  parsedUrl = null
                  downloadButton?.isEnabled = false
                  return toast("链接已变化，请重新解析后再下载")
              }
              val choice = formats.getOrNull(formatSpinner?.selectedItemPosition ?: 0) ?: formats.firstOrNull() ?: return
              val task = runCatching {
                  DownloadTaskStore.add(this, url, info.optString("title", "媒体下载"), choice.selector, choice.label)
              }.getOrElse {
                  toast(it.message ?: "无法保存下载任务")
                  return
              }
          """
          s = replace_once(s, old, new, "queue the parsed URL, not editable text")
          s = replace_once(s,
              '            body.addView(text(task.title, 15, true, Color.rgb(23, 32, 51)).apply { maxLines = 2 }, margin(bottom = 5))',
              '            body.addView(text(task.title, 15, true, Color.rgb(23, 32, 51)).apply { maxLines = 2 }, margin(bottom = 4))\n            body.addView(text(task.url, 11, false, Color.rgb(122, 132, 150)).apply { maxLines = 1; ellipsize = android.text.TextUtils.TruncateAt.END }, margin(bottom = 7))',
              "display stored task URL")
          p.write_text(s)

          p = Path("app/src/main/java/com/downkit/android/DownloadTaskStore.kt")
          s = p.read_text()
          s = replace_once(s, "import android.content.Context", "import android.content.Context\nimport android.net.Uri", "Uri import")
          s = replace_once(s,
              "    private fun write(context: Context, tasks: List<DownloadTask>) {",
              "    private fun write(context: Context, tasks: List<DownloadTask>, persistImmediately: Boolean = false) {",
              "durable write mode")
          s = replace_once(s,
              '        context.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY, array.toString()).apply()',
              '        val editor = context.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().putString(KEY, array.toString())\n        if (persistImmediately) {\n            check(editor.commit()) { "下载任务没有成功写入本机队列，请重试" }\n        } else {\n            editor.apply()\n        }',
              "commit new queue tasks")

          old = """    fun add(context: Context, url: String, title: String, formatSelector: String, formatLabel: String): DownloadTask {
              val task = DownloadTask(UUID.randomUUID().toString(), url, title, formatSelector, formatLabel)
              val tasks = read(context)
              tasks.add(0, task)
              write(context, tasks.take(100))
              return task
          }
          """
          new = """    fun add(context: Context, url: String, title: String, formatSelector: String, formatLabel: String): DownloadTask {
              val cleanUrl = url.trim()
              val parsed = Uri.parse(cleanUrl)
              require((parsed.scheme == "http" || parsed.scheme == "https") && !parsed.host.isNullOrBlank()) {
                  "下载链接为空或不完整，请返回首页重新解析"
              }
              val task = DownloadTask(UUID.randomUUID().toString(), cleanUrl, title, formatSelector, formatLabel)
              val tasks = read(context)
              tasks.add(0, task)
              val active = tasks.filterNot { it.status == "已完成" || it.status == "已取消" || it.status == "失败" }
              val finished = tasks.filter { it.status == "已完成" || it.status == "已取消" || it.status == "失败" }.take(150)
              write(context, active + finished, persistImmediately = true)
              return task
          }
          """
          s = replace_once(s, old, new, "validate and persist queue item")
          p.write_text(s)
          PY

          grep -n -E 'parsedUrl|requestGeneration|task.url|persistImmediately|cleanUrl' app/src/main/java/com/downkit/android/MainActivity.kt app/src/main/java/com/downkit/android/DownloadTaskStore.kt
          grep -q 'task.url' app/src/main/java/com/downkit/android/MainActivity.kt
          grep -q 'editor.commit()' app/src/main/java/com/downkit/android/DownloadTaskStore.kt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if 'versionCode = 2' not in s or 'versionName = "1.0.1"' not in s:
              raise SystemExit("Expected 1.0.1 base version before queue fix")
          s = s.replace("versionCode = 2", "versionCode = 3", 1)
          s = s.replace('versionName = "1.0.1"', 'versionName = "1.0.2"', 1)
          p.write_text(s)
          PY
          grep -n -E 'versionCode|versionName' app/build.gradle.kts

      - name: Build APKs
        working-directory: DownKit-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownKit-debug-apks
          path: DownKit-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
