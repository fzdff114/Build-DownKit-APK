name: Build DownKit APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/patch_1_1_4.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eu
          set +o pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download DownKit 1.1.3 source baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.3/DownKit-Android-1.1.4-source.zip" \
            -o "$RUNNER_TEMP/downkit-1.1.3-source.zip"
          unzip -t "$RUNNER_TEMP/downkit-1.1.3-source.zip" >/dev/null
          mkdir -p DownKit-Android
          unzip -oq "$RUNNER_TEMP/downkit-1.1.3-source.zip" -d DownKit-Android
          test -f DownKit-Android/gradlew
          test -f DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt
          grep -Eq 'versionCode = (8|9)' DownKit-Android/app/build.gradle.kts
          grep -Eq 'versionName = "1.1.(3|4)"' DownKit-Android/app/build.gradle.kts
          grep -q 'class BackgroundCropView' DownKit-Android/app/src/main/java/com/downkit/android/BackgroundCropView.kt

      - name: Apply DownKit 1.1.4 fixes and parallel download feature
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_1_1_4.py
          python3 .github/scripts/patch_parallel_download.py
          MAIN="DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt"
          STORE="DownKit-Android/app/src/main/java/com/downkit/android/DownloadTaskStore.kt"
          SERVICE="DownKit-Android/app/src/main/java/com/downkit/android/DownloadService.kt"
          PYTHON="DownKit-Android/app/src/main/python"
          GRADLE="DownKit-Android/app/build.gradle.kts"
          grep -q 'versionCode = 9' "$GRADLE"
          grep -q 'versionName = "1.1.4"' "$GRADLE"
          grep -q 'setSingleChoiceItems(labels, checked)' "$MAIN"
          grep -q 'showFormatPicker(kind)' "$MAIN"
          grep -Fq 'categoryButton("video", videoFormats.size, "视频选项")' "$MAIN"
          grep -Fq 'categoryButton("audio", audioFormats.size, "音频选项")' "$MAIN"
          grep -Fq 'text = "开始下载"' "$MAIN"
          grep -Fq '.setPositiveButton("确定", null)' "$MAIN"
          grep -Fq 'FormatChoice("自动最佳画质 · 视频 + 音频"' "$MAIN"
          grep -Fq 'FormatChoice("仅音频 · 最佳可用音质"' "$MAIN"
          grep -Fq 'Regex("(?im)^App version:' "$MAIN"
          grep -q 'ActivityResultContracts.GetContent()' "$MAIN"
          grep -Fq 'backgroundPicker.launch("image/*")' "$MAIN"
          grep -Fq 'BackgroundCropView(this, bitmap, aspect)' "$MAIN"
          grep -Fq 'cropView.createCroppedBitmap()' "$MAIN"
          grep -Fq 'listOf("system" to "系统默认", "light" to "浅色", "dark" to "深色")' "$MAIN"
          grep -q 'if (DownloadTaskStore.backgroundUri(this).isNotBlank())' "$MAIN"
          grep -Fq 'autoButtonColorEnabled = hasStoredBackground && DownloadTaskStore.autoButtonColor(this)' "$MAIN"
          ! grep -q '按钮颜色预览\|colorPreview' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          main = Path("DownKit-Android/app/src/main/java/com/downkit/android/MainActivity.kt").read_text(encoding="utf-8")
          start = main.index("private fun showFormatPicker")
          end = main.index("private fun parseLink", start)
          if "startDownload()" in main[start:end]:
              raise SystemExit("Format selection must not start a download")
          if "Regex(\"(?im)^App version:" not in main:
              raise SystemExit("Release notes App version must override the release tag")
          PY
          SERVICE="DownKit-Android/app/src/main/java/com/downkit/android/DownloadService.kt"
          grep -Fq 'private fun buildDownKitNotification' "$SERVICE"
          grep -Fq '.setStyle(NotificationCompat.BigTextStyle()' "$SERVICE"
          grep -Fq '.setContentText(compact)' "$SERVICE"
          grep -Fq 'val selectedSummary = selected?.label' "$MAIN"
          grep -Fq 'val actualFormat = task.mediaInfo.ifBlank { task.formatLabel }' "$MAIN"
          ! grep -Fq 'views.status.text = "${task.status} · ${task.formatLabel}"' "$MAIN"
          grep -Fq 'detail = f"已下载 {downloaded_text}/{total_text}"' "$PYTHON/bridge.py"
          grep -Fq 'parallel_http.install(_parallel_download_cancelled)' "$PYTHON/bridge.py"
          grep -Fq '"parallel_download_threads": download_threads' "$PYTHON/bridge.py"
          grep -Fq '"concurrent_fragment_downloads": download_threads' "$PYTHON/bridge.py"
          grep -Fq 'def split_byte_ranges(total_size: int, worker_count: int)' "$PYTHON/parallel_http.py"
          grep -Fq 'fun downloadThreads(context: Context): Int' "$STORE"
          grep -Fq 'fun setDownloadThreads(context: Context, value: Int)' "$STORE"
          grep -Fq 'val threadCountSeek = SeekBar(this)' "$MAIN"
          grep -Fq 'DownloadTaskStore.downloadThreads(this)' "$SERVICE"
          grep -Fq 'download_threads: int = 1' "$PYTHON/bridge.py"
          PYTHONPATH="$PYTHON" python3 .github/scripts/test_parallel_http.py
          python3 -m py_compile "$PYTHON/bridge.py" "$PYTHON/parallel_http.py"
          python3 -m py_compile .github/scripts/patch_1_1_4.py .github/scripts/patch_parallel_download.py .github/scripts/test_parallel_http.py

      - name: Prepare ARM64 Kotlin and Gradle configuration
        working-directory: DownKit-Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('abiFilters += listOf("arm64-v8a", "x86_64")', 'abiFilters += listOf("arm64-v8a")', 1)
          lines = s.splitlines()
          if "    splits {" in lines:
              start = lines.index("    splits {")
              end = next((i for i in range(start + 1, len(lines)) if lines[i] == "    }"), None)
              if end is None:
                  raise SystemExit("Malformed ABI split block")
              del lines[start:end + 1]
          s = "\n".join(lines) + "\n"
          old = "\n".join(["    kotlinOptions {", '        jvmTarget = "17"', "    }"])
          s = s.replace(old, "", 1)
          if "compilerOptions {" not in s:
              s += "\n".join(["", "kotlin {", "    compilerOptions {", "        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)", "    }", "}", ""])
          if "splits {" in s:
              raise SystemExit("ABI split block remains")
          p.write_text(s)
          w = Path("gradle/wrapper/gradle-wrapper.properties")
          w.write_text(w.read_text().replace("gradle-8.13-bin.zip", "gradle-8.14.4-bin.zip"))
          PY

      - name: Compile-check Debug APK
        working-directory: DownKit-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.DOWNKIT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOWNKIT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOWNKIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOWNKIT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing repository secret DOWNKIT_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing repository secret DOWNKIT_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret DOWNKIT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret DOWNKIT_KEY_PASSWORD"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/downkit-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "DOWNKIT_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "DOWNKIT_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DOWNKIT_KEY_ALIAS=$KEY_ALIAS"
            echo "DOWNKIT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed ARM64 Release APK
        working-directory: DownKit-Android
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          CERTS="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          grep -Fq "Signer #1 certificate SHA-256 digest: ca296e9535db5eb07e3bf852ea644cf5edd66154024d496dca74e565fd66ce24" <<< "$CERTS"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "versionName='1.1.4' versionCode='9'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'
          echo "APK metadata verified: app version 1.1.4, versionCode 9, ARM64 only."

      - name: Package APK, source and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp DownKit-Android/app/build/outputs/apk/release/app-release.apk release-package/DownKit-1.1.4-arm64.apk
          (cd DownKit-Android && zip -qr -X "$GITHUB_WORKSPACE/release-package/DownKit-Android-1.1.4-source.zip" . -x '*/build/*' '.gradle/*' '*/.cxx/*' 'local.properties')
          (cd release-package && sha256sum DownKit-1.1.4-arm64.apk DownKit-Android-1.1.4-source.zip > SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.4-source.zip >/dev/null
          ls -lh release-package/

      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: DownKit-1.1.4-release-package
          path: release-package/*
          if-no-files-found: error
          retention-days: 30
