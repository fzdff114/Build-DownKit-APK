name: Publish DownKit APK Release

on:
  workflow_run:
    workflows: ["Build DownKit APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify signed package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DownKit-1.1.2-release-package --dir release-package
          test -s release-package/DownKit-1.1.2-arm64.apk
          test -s release-package/DownKit-Android-1.1.2-source.zip
          test -s release-package/SHA256SUMS.txt
          (cd release-package && sha256sum --check SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.2-source.zip >/dev/null

      - name: Publish DownKit 1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.2"
          NOTES="$(cat <<'EOF'
          # DownKit 1.1.2

          Replacement build for the existing 1.1.2 release. ARM64 Android APK signed with the same persistent Release key. The visible version remains 1.1.2 while versionCode is increased to 7 so Android can install it over the previous 1.1.2 build.

          ## What's improved
          - Background import opens a crop editor. Drag inside the crop box to move it and drag the four corner handles to resize it.
          - The crop selection keeps the app page's aspect ratio. The high-quality cropped image is saved inside the app and remains after restart.
          - Background rendering uses full-image fitting rather than forced CENTER_CROP, avoiding the old double-crop / incomplete-background issue.
          - Added display mode controls: System default, Light and Dark. The selected mode is saved and restored.
          - Added automatic button accent matching from the background's dominant color. It re-evaluates when the background changes.
          - Kept manual RGB controls. Moving an RGB slider turns off automatic color matching; the manual color persists.
          - Existing download format/resolution, fragment progress, compact notifications and download features are retained.

          ## Downloads
          - DownKit-1.1.2-arm64.apk — ARM64 Android installer.
          - DownKit-Android-1.1.2-source.zip — complete public Android Studio source.
          - SHA256SUMS.txt — SHA-256 checksums.

          ## Upgrade
          Uses the same application ID and the same fixed Release signing key as previous 1.1.2, with versionCode 7 for an in-place upgrade. No uninstall should be required.

          ## Compatibility
          Uses yt-dlp and inherits supported-site and site-change limitations. Some sites may require user-supplied cookies or specific network access. DRM-protected media is not supported.
          EOF
          )"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DownKit 1.1.2" --notes "$NOTES"
          gh release upload "$TAG" release-package/DownKit-1.1.2-arm64.apk release-package/DownKit-Android-1.1.2-source.zip release-package/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,isPrerelease,assets
