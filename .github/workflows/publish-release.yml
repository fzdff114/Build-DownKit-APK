name: Publish DownKit APK Release

on:
  workflow_run:
    workflows: ["Build DownKit APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify signed package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DownKit-1.1.3-release-package --dir release-package
          test -s release-package/DownKit-1.1.3-arm64.apk
          test -s release-package/DownKit-Android-1.1.3-source.zip
          test -s release-package/SHA256SUMS.txt
          (cd release-package && sha256sum --check SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.3-source.zip >/dev/null
          (cd release-package && sha256sum --check SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.3-source.zip >/dev/null

      - name: Publish DownKit 1.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.3"
          NOTES="$(cat <<'EOF'
          # DownKit 1.1.3 — replacement build

          This updates the existing v1.1.3 release assets. The installed Android application also identifies itself as **1.1.3**.

          App version: 1.1.3 (versionCode 9)

          ## Corrections included
          - The home screen has two distinct format-category entries: **Video options** and **Audio options**. Each opens its own list of formats actually returned by yt-dlp.
          - Choosing a format only selects it. It does not immediately start a download. The separate **Start download** button starts the queued task.
          - Automatic best quality, compatibility-first single-file and audio-only choices are retained.
          - Format labels are constrained to the available button width and truncated cleanly on narrow screens.
          - Background import opens the crop editor. The crop box can be moved and resized with its corner handles; the cropped image is saved in app-private storage.
          - System default, Light and Dark display modes remain available.
          - Automatic background-color matching is offered only after a custom background is imported.
          - Removed the Button color preview control. RGB sliders and restore-default color remain.
          - The in-app updater reads the App version field in these release notes, so a replacement binary can be detected even though the public release tag remains v1.1.3.

          ## Upgrade compatibility
          - Package ID remains `com.downkit.android`.
          - The same persistent Release signing key is used.
          - APK versionCode 9 is higher than v1.1.3 versionCode 8, so it supports an in-place upgrade.
          - ARM64 (`arm64-v8a`) Android APK.

          ## Downloads
          - DownKit-1.1.3-arm64.apk — stable v1.1.3 download URL; application version 1.1.3.
          - DownKit-Android-1.1.3-source.zip — complete source for the replacement build.
          - SHA256SUMS.txt — SHA-256 checksums.

          Site support depends on the target website, network and login state. DRM-protected media is not supported.
          EOF
          )"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DownKit 1.1.3" --notes "$NOTES"
          gh release upload "$TAG" release-package/DownKit-1.1.3-arm64.apk release-package/DownKit-Android-1.1.3-source.zip release-package/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p release-verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "DownKit-1.1.3-arm64.apk" --pattern "DownKit-Android-1.1.3-source.zip" --pattern "SHA256SUMS.txt" --dir release-verify
          (cd release-verify && sha256sum --check SHA256SUMS.txt)
          unzip -t release-verify/DownKit-Android-1.1.3-source.zip >/dev/null
          test -s release-verify/DownKit-1.1.3-arm64.apk

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,isPrerelease,assets
