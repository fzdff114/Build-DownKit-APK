name: Publish DownKit APK Release

on:
  workflow_run:
    workflows: ["Build DownKit APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify signed package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DownKit-1.1.2-release-package --dir release-package
          test -s release-package/DownKit-1.1.2-arm64.apk
          test -s release-package/DownKit-Android-1.1.2-source.zip
          test -s release-package/SHA256SUMS.txt
          (cd release-package && sha256sum --check SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.2-source.zip >/dev/null

      - name: Publish DownKit 1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.2"
          NOTES="$(cat <<'EOF'
          # DownKit 1.1.2

          ARM64 Android release, signed with the same persistent Release key as 1.1.1.

          ## What's new
          - Download task cards now show the actual media container/format and resolution, such as MP4, WebM, MKV, M4A, 1920×1080 or 1280×720, based on yt-dlp's real format metadata rather than forcing MP4.
          - During fragmented downloads, task details show the current fragment and total fragment count when the site exposes them.
          - Notification content is simplified to the file name and concise progress/status only.
          - Import a picture in Settings to use it as the app background. The selected image URI is persisted and restored after restarting the app; a restore-default action is provided.
          - Customize button accent color with RGB sliders inside a collapsed color panel in Settings. The color controls expand only when requested and the selected color persists across launches.
          - Existing application ID and fixed signing identity are retained to support in-place upgrades from 1.1.1.

          ## Downloads
          - DownKit-1.1.2-arm64.apk — ARM64 Android installer.
          - DownKit-Android-1.1.2-source.zip — complete public Android Studio source.
          - SHA256SUMS.txt — SHA-256 checksums.

          ## Compatibility
          Uses yt-dlp and inherits the supported-site and site-change limitations of yt-dlp. Some sites may require login cookies or may change their formats. DRM-protected media is not supported.
          EOF
          )"
          gh release create "$TAG" release-package/DownKit-1.1.2-arm64.apk release-package/DownKit-Android-1.1.2-source.zip release-package/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "DownKit 1.1.2" --notes "$NOTES"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,isPrerelease,assets
