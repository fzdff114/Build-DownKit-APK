name: Publish DownKit APK Release

on:
  workflow_run:
    workflows: ["Build DownKit APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify signed package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DownKit-1.1.4-release-package --dir release-package
          test -s release-package/DownKit-1.1.4-arm64.apk
          test -s release-package/DownKit-Android-1.1.4-source.zip
          test -s release-package/SHA256SUMS.txt
          (cd release-package && sha256sum --check SHA256SUMS.txt)
          unzip -t release-package/DownKit-Android-1.1.4-source.zip >/dev/null

      - name: Publish DownKit 1.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.4"
          NOTES="$(cat <<'EOF'
          # DownKit 1.1.4

          This release corrects the format-selection and background appearance controls from 1.1.3.

          ## Fixes
          - After parsing, the home page shows two category choices: Video and Audio. Each opens its own list of formats returned by yt-dlp.
          - Format rows show the actual parsed resolution, container extension and available size/quality details. Selecting a row does not immediately start a download; confirm with “Download selected format”.
          - Background import uses the system content picker and opens the crop editor. The selected crop is saved inside the app, so the app does not depend on retaining the source image permission.
          - Auto-match background accent is hidden until a custom background has been imported. It remains opt-in and re-evaluates when the background is changed.
          - Removed the “Button color preview” control. Manual RGB sliders and the restore-default-color action remain available.

          ## Compatibility
          - Same application ID and persistent release signing key as 1.1.3; versionCode 9 allows an in-place upgrade.
          - ARM64 Android APK. yt-dlp site support still depends on target-site changes, network and login requirements. DRM-protected media is not supported.

          ## Downloads
          - DownKit-1.1.4-arm64.apk — signed ARM64 installer.
          - DownKit-Android-1.1.4-source.zip — Android Studio source.
          - SHA256SUMS.txt — SHA-256 checksums.
          EOF
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DownKit 1.1.4" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "DownKit 1.1.4" --notes "$NOTES"
          fi
          gh release upload "$TAG" release-package/DownKit-1.1.4-arm64.apk release-package/DownKit-Android-1.1.4-source.zip release-package/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,isPrerelease,assets
