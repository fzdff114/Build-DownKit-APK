name: Publish DownKit APK Release

on:
  workflow_run:
    workflows: ["Build DownKit APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DownKit-debug-apks --dir release-files
          test -s release-files/app-debug.apk
          unzip -t release-files/app-debug.apk >/dev/null
          sha256sum release-files/app-debug.apk | tee release-files/SHA256SUMS.txt
          ls -lh release-files/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.2"
          NOTES="$(cat <<'EOF'
          ## DownKit Android 1.0.2 — ARM64 Debug

          - Fixes queued-task URL loss: every task now keeps the exact URL used for its successful metadata parse.
          - Editing or replacing a URL invalidates stale metadata, preventing one video's title/formats from being paired with another or a blank URL.
          - Queue additions are validated and synchronously persisted before the download service starts.
          - Waiting/running tasks are no longer silently dropped by the old 100-task truncation.
          - Task cards show the stored source URL for verification.
          - Bilibili extractor and title/thumbnail metadata flow are preserved.

          ARM64 (arm64-v8a) Android APK. Debug-signed test release, not a production/release-signed build.
          See SHA256SUMS.txt to verify the APK download.
          EOF
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/app-debug.apk release-files/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-files/app-debug.apk release-files/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "DownKit 1.0.2 (ARM64 Debug)" --notes "$NOTES" --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,isPrerelease,assets
